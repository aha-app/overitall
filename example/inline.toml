batch_window_ms = 5000
max_log_buffer_mb = 50
start_processes = ["web", "worker", "monitor"]
process_coloring = true

[procfile]
web = "ruby web_server.rb"
worker = "ruby worker.rb"
monitor = "ruby monitor.rb"
broken = "./nonexistent_command_that_will_fail"
flaky = 'echo "flaky: booting"; sleep 3; echo "flaky: crashing"; exit 3'

[processes.web]
log_file = "web.log"

[processes.worker]
log_file = "worker.log"

[processes.flaky]
restart = "on-failure"

[groups]
app = ["web", "worker"]
